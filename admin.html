<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administrador</title><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><div class="wrap">
<header><h1>Administrador</h1><a class="btn alt" href="index.html">Ver el sitio</a></header>
<section id="login" style="max-width:360px;margin-top:24px">
<form id="f"><label for="em">Correo</label><input id="em" type="email" autocomplete="username" required>
<label for="pw">Contraseña</label><input id="pw" type="password" autocomplete="current-password" required>
<p id="err" class="note" role="alert"></p><button class="btn" type="submit">Entrar</button></form></section>
<section id="panel" hidden>
<p class="note">Los precios y textos se guardan al pulsar “Guardar cambios”. Las fotos se suben al instante.</p>
<div id="ed"></div>
<div class="bar"><button class="btn" id="save" type="button">Guardar cambios</button><button class="btn alt" id="out" type="button">Salir</button><span id="st" class="note" role="status"></span></div>
</section></div>
<script type="module" src="js/admin.js"></script></body></html>
